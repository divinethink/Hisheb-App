name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore: ['*.zip']
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # CI-গেট: lint + typecheck + test সবুজ না হলে deploy চলবে না
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Create .env file (test-এর জন্য, ENV_STAGING reuse)
        env:
          ENV_FILE: ${{ secrets.ENV_STAGING }}
        run: printf '%s\n' "$ENV_FILE" > .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build_and_deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Create .env.production file (live সাইট — debug token কখনো না)
        env:
          ENV_FILE: ${{ secrets.ENV_PRODUCTION }}
        run: printf '%s\n' "$ENV_FILE" > .env.production

      - name: Install Dependencies and Build
        run: npm ci && npx vite build --mode production

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HISHAB_NIKASH_41B9B }}'
          channelId: live
          projectId: hishab-nikash-41b9b
