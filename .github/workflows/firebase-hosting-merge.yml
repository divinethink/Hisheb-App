name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Create .env.production file (live সাইট — debug token কখনো না)
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

      - name: Install Dependencies and Build
        run: npm ci && npx vite build --mode production

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HISHAB_NIKASH_41B9B }}'
          channelId: live
          projectId: hishab-nikash-41b9b
