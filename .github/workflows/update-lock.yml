name: update-lock

# zip আপলোডের (unzip-upload) পর নিজে চলে: package.json-এর সাথে package-lock.json না মিললে lock ঠিক করে commit করে,
# তারপর CI ও deploy চালু করে। মিলে থাকলে কিছুই করে না। হাতে চালাতে: Actions -> update-lock -> Run workflow।
on:
  workflow_run:
    workflows: [unzip-upload]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Update package-lock.json (শুধু lock, কোড/node_modules অপরিবর্তিত)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit and trigger CI + deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "lock already matches package.json"
            exit 0
          fi
          git config user.name "lock-bot"
          git config user.email "lock-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
          gh workflow run firebase-hosting-merge.yml --ref main
