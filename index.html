<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1c1c1e" />
    <!-- iOS: Add-to-Home-Screen থেকে খুললে যেন Safari URL-বার ছাড়া standalone মোডে চলে (Android-এ manifest.display এই কাজ করে) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="হিসাব-নিকাশ" />
    <title>হিসাব-নিকাশ</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Perf: Firebase/Google host-এ DNS+TLS আগেভাগে শুরু (Architecture Plan §৭) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <!-- Google Identity Services (GIS) স্ক্রিপ্ট এখন দরকারের সময় লোড হয় (data/googleDrive.ts → loadGoogleIdentity); preconnect Auth popup-এও কাজে লাগে -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
